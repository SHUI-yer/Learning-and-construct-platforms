spring:
  application:
    name: lp-starter
  profiles:
    # 未显式指定环境时采用生产安全配置；本地开发请启用 dev profile。
    default: prod

  # 数据源
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/light_out?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    # 新库会执行 V1；已有非空库首次接入时必须显式临时开启，禁止默认静默基线。
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    baseline-description: legacy schema v2.0
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    out-of-order: false

  # Redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      database: ${SPRING_DATA_REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

# 服务端口
server:
  port: ${SERVER_PORT:8080}

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  # type-aliases-package 已移除：lpauth 和 lpcourse 都有 StudentClass 实体，
  # 别名扫描会冲突；且所有 mapper XML 均使用全限定类名，并不依赖别名
  configuration:
    map-underscore-to-camel-case: true

# CORS 来源由 profile 决定：dev 默认只允许本机前端，prod 默认不允许跨域。
app:
  cors:
    allowed-origins: []

# JWT 签名配置
jwt:
  # 必填：通过环境变量 JWT_SECRET 注入，至少 32 字节；缺失时应用启动失败（fail-fast）
  # 仓库内不允许出现真实密钥
  secret: ${JWT_SECRET:}
  # 令牌有效期（小时）
  expire-hours: 12

# 口令策略
security:
  password:
    # 存量无盐 MD5 账号的处理方式：
    #   migrate（默认）登录成功后立即迁移为 BCrypt，旧哈希不再保留
    #   reject        直接拒绝登录，要求管理员重置密码（会锁死尚未重置的存量账号）
    legacy-md5: migrate

# Actuator 使用独立的本机监听端口，不经公网暴露。
management:
  server:
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:development}
